<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark access</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc;
          --accent:#2f6fde; --ok:#1f8a4c; --bad:#c2372f; --warn:#a86b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --muted:#a3a29b; --line:#33332f;
            --accent:#6b9cf0; --ok:#4cc27e; --bad:#ef6b62; --warn:#e0a640; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between;
           padding:14px 24px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:17px; margin:0; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); } .warn { color:var(--warn); }
  a, .link { color:var(--accent); }
  button, .btn { font:inherit; padding:7px 14px; border-radius:7px; border:1px solid var(--accent);
                 background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondary { background:transparent; color:var(--ink); border-color:var(--line); }
  button.danger { background:transparent; color:var(--bad); border-color:var(--bad); }
  input, textarea { font:inherit; width:100%; padding:8px 10px; border-radius:7px;
                    border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  textarea { font-family: ui-monospace, monospace; font-size:13px; min-height:90px; }
  label { display:block; font-weight:600; margin:14px 0 4px; }
  .hint { color:var(--muted); font-size:13px; margin-top:3px; }
  .error { background:color-mix(in srgb, var(--bad) 12%, transparent); border:1px solid var(--bad);
           border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  .secret { font-family: ui-monospace, monospace; background:var(--bg); border:1px dashed var(--line);
            padding:6px 10px; border-radius:6px; word-break:break-all; }
  .pills span { display:inline-block; margin-right:14px; font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row input { width:auto; flex:1; min-width:0; }
  @media (max-width: 720px) { .hide-sm { display:none; } header { padding:12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Spark access</h1>
  {% if admin %}
  <form method="post" action="/logout" class="row">
    <span class="muted">{{ admin }}</span>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="secondary" type="submit">Sign out</button>
  </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
